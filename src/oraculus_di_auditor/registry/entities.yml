# Cross-categorical finding types — these map to D-13 sub-finding-IDs.
# Each type has an associated severity-elevation rule per §4.3 of the protocol.
finding_types:
  - id: A
    name: "Budget/Fiscal Cross-Reference"
    severity_default: "HIGH"
    severity_elevation: "CRITICAL when new vendor presence revealed"

  - id: B
    name: "Personnel Migration"
    severity_default: "HIGH"
    severity_elevation: "CRITICAL when personnel migrates from procurement authority to subject of prosecution (Fahoum precedent)"

  - id: C
    name: "Vendor Cross-Contamination"
    severity_default: "CRITICAL"
    severity_elevation: "Always CRITICAL — new vendor presence in non-standard record category"

  - id: D
    name: "Operational Intersection"
    severity_default: "HIGH"

  - id: E
    name: "Governance Chain Cross-Reference"
    severity_default: "HIGH"
    severity_elevation: "CRITICAL when governance action by one entity creates obligation unmet by another (Ordinance 3611 / AB 481 precedent)"

  - id: F
    name: "Grant/Funding Pipeline Cross-Reference"
    severity_default: "HIGH"

  - id: G
    name: "Data/Evidence Pipeline Cross-Reference"
    severity_default: "HIGH"
    severity_elevation: "CRITICAL when data flows across entities without disclosed governance (Axon Evidence.com → DA access)"

