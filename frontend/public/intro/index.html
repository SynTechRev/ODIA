<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Oraculus Decimus — Project O.D.I.A.</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&family=Share+Tech+Mono&family=Pinyon+Script&family=IM+Fell+English+SC&family=IM+Fell+English:ital@1&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #c8a96e;
  --gold-bright: #e0c688;
  --gold-deep: #8a6f3e;
  --emerald: #50c878;
  --emerald-deep: #2a8a4a;
  --ink: #07090c;
  --ink-2: #0c1014;
  --bone: #f4ead7;
  --parchment: #d9c89e;
}

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%;
  background:var(--ink);
  overflow:hidden;
  touch-action: manipulation;
  font-family: 'Cinzel', serif;
}

#seq {
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse at 50% 50%, var(--ink-2) 0%, var(--ink) 70%);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  overflow:hidden;
  perspective: 1400px;
}

/* ============ DIGITAL-SCAPE LAYERS ============ */
#deep-grid {
  position:absolute; inset:0; z-index:0;
  opacity:0.35;
  background-image:
    linear-gradient(rgba(80,200,120,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(80,200,120,0.04) 1px, transparent 1px);
  background-size: 60px 60px;
  animation: gridDrift 80s linear infinite;
  mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 90%);
  -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 90%);
}
@keyframes gridDrift {
  0%   { transform: translate(0,0); }
  100% { transform: translate(60px, 60px); }
}

#data-rings {
  position:absolute;
  top:50%; left:50%;
  width: 140vmax; height:140vmax;
  transform: translate(-50%,-50%);
  z-index:0;
  opacity:0.12;
  pointer-events:none;
}
.ring {
  position:absolute;
  top:50%; left:50%;
  border-radius:50%;
  border:1px solid rgba(200,169,110,0.3);
  transform: translate(-50%,-50%);
  animation: ringPulse 8s ease-in-out infinite;
}
@keyframes ringPulse {
  0%,100% { opacity:0.2; }
  50%     { opacity:0.6; }
}

#hex-mesh {
  position:absolute; inset:0; z-index:1;
  opacity:0.18;
  pointer-events:none;
  mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, transparent 20%, black 60%, transparent 100%);
  -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, transparent 20%, black 60%, transparent 100%);
}

#facets-wrap {
  position:absolute;
  inset:-15%;
  z-index:2;
  opacity:0.28;
  animation: drift 80s linear infinite;
  transform-origin: center center;
}
@keyframes drift {
  0%   { transform: rotate(0deg)   scale(1.05); }
  50%  { transform: rotate(180deg) scale(1.15); }
  100% { transform: rotate(360deg) scale(1.05); }
}
#facets { width:100%; height:100%; }

#data-streams {
  position:absolute; inset:0; z-index:3;
  opacity:0.22;
  pointer-events:none;
  font-family:'Share Tech Mono', monospace;
  font-size:11px;
  color: var(--emerald);
  overflow:hidden;
}
.stream {
  position:absolute;
  top:-100px;
  white-space:nowrap;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  letter-spacing:0.15em;
  animation: streamFall linear infinite;
  text-shadow: 0 0 4px rgba(80,200,120,0.6);
}
@keyframes streamFall {
  0%   { transform: translateY(-30%); opacity:0; }
  10%  { opacity:0.8; }
  90%  { opacity:0.4; }
  100% { transform: translateY(110vh); opacity:0; }
}

#vignette {
  position:absolute; inset:0; z-index:4;
  pointer-events:none;
  background: radial-gradient(ellipse 75% 65% at 50% 50%,
    transparent 0%,
    transparent 40%,
    rgba(0,0,0,0.5) 75%,
    rgba(0,0,0,0.95) 100%);
}

#embers { position:absolute; inset:0; z-index:5; pointer-events:none; }
.ember {
  position:absolute;
  bottom:-20px;
  width:2px; height:2px;
  background: var(--gold);
  border-radius:50%;
  box-shadow:0 0 8px var(--gold), 0 0 16px rgba(200,169,110,0.5);
  opacity:0;
  animation: rise linear infinite;
}
@keyframes rise {
  0%   { transform: translateY(0)     translateX(0); opacity:0; }
  10%  { opacity:0.75; }
  90%  { opacity:0.4; }
  100% { transform: translateY(-110vh) translateX(var(--drift,20px)); opacity:0; }
}

#scanline {
  position:absolute; left:0; right:0;
  height:2px;
  background:linear-gradient(90deg, transparent, rgba(80,200,120,0.1), transparent);
  animation:scan 9s linear infinite;
  z-index:6;
  pointer-events:none;
}
@keyframes scan { 0%{top:-2px} 100%{top:100%} }

#grain {
  position:absolute; inset:0; z-index:7;
  pointer-events:none;
  opacity:0.07;
  mix-blend-mode:overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.5'/></svg>");
}

#smoke {
  position:absolute; inset:0; z-index:8;
  pointer-events:none;
  opacity:0;
  transition:opacity 2s ease;
  background:
    radial-gradient(ellipse 60% 50% at 30% 60%, rgba(80,80,80,0.25) 0%, transparent 60%),
    radial-gradient(ellipse 50% 60% at 70% 40%, rgba(40,30,20,0.3) 0%, transparent 60%),
    radial-gradient(ellipse 80% 60% at 50% 50%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.85) 100%);
}
#smoke.visible { opacity:1; }

#glitch {
  position:absolute; inset:0; z-index:9;
  pointer-events:none;
  opacity:0;
  background:
    repeating-linear-gradient(0deg,
      transparent 0px,
      transparent 2px,
      rgba(80,200,120,0.06) 2px,
      rgba(80,200,120,0.06) 3px);
  mix-blend-mode:screen;
}
#glitch.flash { animation: glitchPulse 0.7s steps(8,end) 1; }
@keyframes glitchPulse {
  0%   { opacity:0; transform:translateX(0); }
  20%  { opacity:0.9; transform:translateX(-3px); }
  40%  { opacity:0.5; transform:translateX(4px); }
  60%  { opacity:0.85; transform:translateX(-2px); }
  80%  { opacity:0.3; transform:translateX(1px); }
  100% { opacity:0; transform:translateX(0); }
}

#parchment-glow {
  position:absolute; inset:0; z-index:9;
  pointer-events:none;
  opacity:0;
  transition: opacity 2.5s ease;
  background: radial-gradient(ellipse 70% 50% at 50% 55%,
    rgba(217,200,158,0.08) 0%,
    rgba(200,169,110,0.05) 30%,
    transparent 70%);
}
#parchment-glow.visible { opacity:1; }

/* === STAGE === */
#stage {
  position:relative;
  z-index:15;
  width:100%;
  max-width:880px;
  padding:0 24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}

/* ==============================
   PHASE 0 — PROJECT O.D.I.A. BOOT SIGIL
   ============================== */
#phase-0 {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap: clamp(10px, 2vw, 16px);
  width:100%;
}

#boot-prefix {
  font-family:'Share Tech Mono', monospace;
  font-size: clamp(10px, 2.4vw, 13px);
  letter-spacing: 0.3em;
  color: rgba(80,200,120,0.75);
  text-transform: uppercase;
  text-shadow: 0 0 8px rgba(80,200,120,0.4);
  opacity:0;
  transition: opacity 0.6s ease;
  display:flex;
  align-items:center;
  gap: 10px;
}
#boot-prefix.visible { opacity:1; }
#boot-prefix::before {
  content:'';
  display:inline-block;
  width:6px; height:6px;
  background: var(--emerald);
  border-radius:50%;
  box-shadow: 0 0 8px var(--emerald);
  animation: blink 1s step-end infinite;
}

#boot-odia {
  font-family:'Cinzel Decorative', 'Cinzel', serif;
  font-weight:700;
  font-size: clamp(28px, 6.5vw, 54px);
  letter-spacing: 0.32em;
  color: var(--gold);
  -webkit-text-stroke: 0.4px var(--gold-bright);
  text-shadow:
    0 0 18px rgba(200,169,110,0.7),
    0 0 45px rgba(200,169,110,0.35);
  opacity:0;
  transform: scale(0.9);
  transition: opacity 1s ease, transform 1s cubic-bezier(0.22,1,0.36,1);
  display:flex;
}
#boot-odia.visible { opacity:1; transform: scale(1); }

.odia-char {
  display:inline-block;
  opacity:0;
  transform: translateY(10px);
  transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.22,1,0.36,1);
}
.odia-char.shown { opacity:1; transform: translateY(0); }

#boot-tagline {
  font-family: 'IM Fell English', serif;
  font-style: italic;
  font-size: clamp(10px, 2.2vw, 13px);
  letter-spacing: 0.18em;
  color: rgba(217,200,158,0.55);
  opacity: 0;
  transition: opacity 1s ease;
  text-align:center;
}
#boot-tagline.visible { opacity:1; }

/* The whole boot sigil fades out together */
#phase-0.fading-out {
  opacity:0;
  transition: opacity 1s ease;
}

/* ==============================
   PHASE 1 — ORACULUS / DECIMUS
   ============================== */
#phase-1 {
  display:none;
  flex-direction:column;
  align-items:center;
  gap:0;
  width:100%;
}

#title-word-1, #title-word-2 {
  font-family:'Cinzel Decorative', 'Cinzel', serif;
  font-weight:900;
  letter-spacing:0.24em;
  color:var(--bone);
  white-space:nowrap;
  line-height:1.15;
  display:flex;
  text-shadow:
    0 0 1px rgba(244,234,215,0.9),
    0 0 30px rgba(244,234,215,0.18),
    0 2px 0 rgba(0,0,0,0.6);
  -webkit-text-stroke: 0.4px rgba(244,234,215,0.4);
}

#title-word-1 { font-size:clamp(28px, 8.5vw, 76px); }
#title-word-2 { font-size:clamp(28px, 8.5vw, 76px); }

.ltr {
  display:inline-block;
  opacity:0;
  transform:translateY(22px) rotateX(-35deg);
  transform-origin: center bottom;
  transition: opacity 0.7s ease,
              transform 0.95s cubic-bezier(0.22,1,0.36,1),
              color 1.1s ease,
              text-shadow 1.4s ease,
              filter 1.6s ease,
              -webkit-text-stroke 1s ease;
  filter: blur(0px);
  position:relative;
}
.ltr.shown { opacity:1; transform:translateY(0) rotateX(0); }

.ltr::before {
  content:'';
  position:absolute;
  bottom:-3px; left:50%;
  width:0; height:1px;
  background: linear-gradient(90deg, transparent, rgba(200,169,110,0.5), transparent);
  transform:translateX(-50%);
  transition: width 1.5s ease 0.3s;
}
.ltr.shown::before { width:80%; }

.ltr.dissolve {
  opacity:0;
  filter: blur(10px);
  transform: translateY(-18px) scale(0.82) rotateX(50deg);
  color: rgba(120,100,70,0.25);
  text-shadow: 0 0 25px rgba(80,60,40,0.4);
  -webkit-text-stroke: 0px transparent;
}

.ltr.gold {
  color:var(--gold);
  -webkit-text-stroke: 0.5px var(--gold-bright);
  text-shadow:
    0 0 22px rgba(200,169,110,0.95),
    0 0 55px rgba(200,169,110,0.55),
    0 0 100px rgba(200,169,110,0.28);
  animation: pulseGold 2.4s ease-in-out infinite;
}
@keyframes pulseGold {
  0%,100% {
    text-shadow: 0 0 22px rgba(200,169,110,0.95),
                 0 0 55px rgba(200,169,110,0.55),
                 0 0 100px rgba(200,169,110,0.28);
  }
  50% {
    text-shadow: 0 0 32px rgba(224,198,136,1),
                 0 0 75px rgba(200,169,110,0.7),
                 0 0 130px rgba(200,169,110,0.42);
  }
}

.gap-line { height:clamp(8px,2.2vw,18px); }

#title-divider {
  width:0; height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,169,110,0.55),transparent);
  transition:width 1.4s cubic-bezier(0.22,1,0.36,1), opacity 1s ease;
  margin:clamp(8px,2vw,16px) 0;
  box-shadow: 0 0 10px rgba(200,169,110,0.4);
  position:relative;
}
#title-divider.open { width:min(360px,82vw); }
#title-divider::before, #title-divider::after {
  content:'❖';
  position:absolute;
  top:50%; transform:translateY(-50%);
  color: rgba(200,169,110,0.6);
  font-size:8px;
  opacity:0;
  transition: opacity 0.8s ease 0.6s;
}
#title-divider::before { left:-2px; }
#title-divider::after  { right:-2px; }
#title-divider.open::before, #title-divider.open::after { opacity:1; }

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ==============================
   PHASE 2 — EQ + CODE
   ============================== */
#phase-2 {
  display:none;
  flex-direction:column;
  align-items:center;
  gap:clamp(22px,4.5vw,40px);
  width:100%;
}

.eq-row {
  display:flex;
  align-items:center;
  gap:clamp(14px,3.2vw,28px);
  opacity:0;
  transform:scale(0.85);
  transition:opacity 1s ease, transform 1s cubic-bezier(0.22,1,0.36,1);
}
.eq-row.visible { opacity:1; transform:scale(1); }

.us-tok {
  font-family:'Cinzel Decorative', 'Cinzel', serif;
  font-weight:900;
  font-size:clamp(36px,9vw,76px);
  letter-spacing:0.16em;
  color:var(--gold);
  -webkit-text-stroke: 0.5px var(--gold-bright);
  text-shadow:
    0 0 24px rgba(200,169,110,0.78),
    0 0 55px rgba(200,169,110,0.38);
  position:relative;
}
.us-tok.lock { animation: lockPulse 0.65s ease-out 1; }
@keyframes lockPulse {
  0%   { transform: scale(1); }
  40%  {
    transform: scale(1.14);
    text-shadow: 0 0 45px rgba(224,198,136,1),
                 0 0 90px rgba(200,169,110,0.65);
  }
  100% { transform: scale(1); }
}

.plus {
  font-family:'Cinzel',serif;
  font-weight:500;
  font-size:clamp(34px,7.5vw,64px);
  color:var(--bone);
  opacity:0;
  transform:rotate(-180deg) scale(0.2);
  transition:opacity 0.9s ease, transform 0.9s cubic-bezier(0.34,1.56,0.64,1);
  text-shadow: 0 0 18px rgba(244,234,215,0.55);
}
.plus.visible { opacity:1; transform:rotate(0deg) scale(1); }

#code-block {
  font-family:'Share Tech Mono','Courier New',monospace;
  font-size:clamp(10px,2.9vw,14px);
  color:var(--emerald);
  background:rgba(0,15,5,0.9);
  border:1px solid rgba(80,200,120,0.25);
  border-left:3px solid rgba(80,200,120,0.75);
  padding:clamp(14px,3.2vw,22px) clamp(16px,4vw,30px);
  border-radius:2px;
  width:min(420px,92vw);
  opacity:0;
  transition:opacity 0.7s ease;
  line-height:1.95;
  text-align:left;
  box-shadow:
    0 0 35px rgba(80,200,120,0.18),
    inset 0 0 22px rgba(0,30,10,0.5);
  position:relative;
}
#code-block.visible { opacity:1; }
#code-block::before {
  content:'';
  position:absolute;
  top:0; left:0; right:0;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(80,200,120,0.7), transparent);
}

#cursor {
  display:inline-block;
  width:8px; height:14px;
  background:var(--emerald);
  animation:blink 0.7s step-end infinite;
  vertical-align:text-bottom;
  margin-left:2px;
  box-shadow: 0 0 6px var(--emerald);
}

.code-output { color: var(--gold); text-shadow: 0 0 10px rgba(200,169,110,0.6); }
.code-project { color: var(--gold-bright); text-shadow: 0 0 12px rgba(224,198,136,0.7); font-weight:bold; }

/* ==============================
   PHASE 3 — DECLARATION SCRIPT
   ============================== */
#phase-3 {
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(14px,3vw,24px);
  width:100%;
  position:relative;
}

#declaration-frame {
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(14px, 3vw, 24px);
  padding: clamp(22px,5vw,40px) clamp(28px,6vw,56px);
  width:100%;
  text-align:center;
}

.rule-wrap {
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  width: min(440px, 88vw);
  height: 14px;
}
.rule {
  width:0;
  height:1px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(200,169,110,0.15) 10%,
    rgba(200,169,110,0.6) 50%,
    rgba(200,169,110,0.15) 90%,
    transparent 100%);
  transition: width 1.6s cubic-bezier(0.22,1,0.36,1), opacity 1s ease;
  opacity:0;
  box-shadow: 0 0 8px rgba(200,169,110,0.25);
}
.rule.open { width: 100%; opacity:1; }
.rule-wrap::before, .rule-wrap::after {
  content:'';
  position:absolute;
  width: 1px; height: 8px;
  background: rgba(200,169,110,0.55);
  opacity: 0;
  transition: opacity 0.8s ease 0.7s;
}
.rule-wrap.open::before, .rule-wrap.open::after { opacity: 1; }
.rule-wrap::before { left: 0; }
.rule-wrap::after  { right: 0; }

#declaration-line {
  font-family:'Pinyon Script', cursive;
  font-weight:400;
  font-size:clamp(54px, 12vw, 108px);
  color: var(--gold);
  letter-spacing: 0.01em;
  line-height:1.2;
  text-align:center;
  white-space:nowrap;
  text-shadow:
    0 0 1px rgba(200,169,110,0.85),
    0 0 18px rgba(200,169,110,0.55),
    0 0 50px rgba(200,169,110,0.3);
  -webkit-text-stroke: 0.3px var(--gold-bright);
  display:flex;
  justify-content:center;
  align-items:baseline;
  width:100%;
  gap:0.18em;
}

.dec-word {
  display:inline-block;
  opacity:0;
  transform: translateY(8px);
  filter: blur(4px);
  transition:
    opacity 1.6s cubic-bezier(0.22,1,0.36,1),
    transform 1.6s cubic-bezier(0.22,1,0.36,1),
    filter 1.6s ease;
}
.dec-word.visible {
  opacity:1;
  transform: translateY(0);
  filter: blur(0);
}

.dec-word.we-cap { font-size: 1.18em; }

#inscription-block {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap: clamp(4px, 1.2vw, 8px);
  width:100%;
}

#inscription-line-1, #inscription-line-2 {
  font-family:'IM Fell English SC', 'Cinzel', serif;
  font-size: clamp(11px, 2.6vw, 16px);
  letter-spacing: 0.42em;
  color: rgba(217,200,158,0.78);
  text-transform: uppercase;
  opacity:0;
  transition: opacity 1.6s ease;
  text-shadow: 0 0 12px rgba(200,169,110,0.3);
  text-align:center;
  padding-left: 0.42em;
}
#inscription-line-1.visible, #inscription-line-2.visible { opacity:1; }

.ins-bullet {
  display:inline-block;
  margin: 0 0.6em;
  color: var(--gold);
  font-size: 0.6em;
  vertical-align: middle;
  opacity: 0.85;
}

#inscription-date {
  font-family:'IM Fell English', 'Cinzel', serif;
  font-style:italic;
  font-size: clamp(10px, 2.2vw, 13px);
  color: rgba(217,200,158,0.55);
  letter-spacing: 0.15em;
  opacity:0;
  transition: opacity 1.6s ease;
  margin-top: 4px;
  text-align:center;
}
#inscription-date.visible { opacity:1; }

#brand-tag {
  font-family:'Share Tech Mono',monospace;
  font-size:clamp(9px,2vw,11px);
  letter-spacing:0.3em;
  color:rgba(80,200,120,0.6);
  opacity:0;
  transition:opacity 1.4s ease;
  text-transform:uppercase;
  margin-top: clamp(8px, 2vw, 14px);
  text-align:center;
}
#brand-tag.visible { opacity:1; }

/* PROGRESS + REPLAY + BRAND MARK */
#progress {
  position:fixed;
  bottom:0; left:0;
  height:2px;
  background:linear-gradient(90deg,var(--gold),var(--emerald));
  width:0%;
  transition:width 0.5s linear;
  z-index:20;
  box-shadow: 0 0 8px rgba(200,169,110,0.5);
}

#replay {
  position:fixed;
  bottom:18px; right:18px;
  font-family:'Share Tech Mono',monospace;
  font-size:10px;
  color:rgba(244,234,215,0.28);
  background:transparent;
  border:1px solid rgba(244,234,215,0.12);
  padding:7px 14px;
  border-radius:2px;
  cursor:pointer;
  letter-spacing:0.18em;
  transition:color 0.3s,border-color 0.3s, background 0.3s, opacity 0.5s;
  z-index:20;
  text-transform:uppercase;
  /* v2.8.1 Fix #3 — hidden until #seq.completed is set at end of run() */
  opacity: 0;
  pointer-events: none;
}
#seq.completed #replay {
  opacity: 1;
  pointer-events: auto;
}
#replay:hover {
  color:var(--gold);
  border-color:rgba(200,169,110,0.4);
  background:rgba(200,169,110,0.05);
}

#brand-mark {
  position:fixed;
  top:18px; left:18px;
  font-family:'Share Tech Mono',monospace;
  font-size:10px;
  color:rgba(80,200,120,0.4);
  letter-spacing:0.2em;
  z-index:20;
  text-transform:uppercase;
}
#brand-mark::before {
  content:'';
  display:inline-block;
  width:6px; height:6px;
  background: var(--emerald);
  border-radius:50%;
  margin-right:8px;
  box-shadow: 0 0 8px var(--emerald);
  animation: blink 1.6s step-end infinite;
  vertical-align:middle;
}
</style>
</head>
<body>

<div id="seq">

  <!-- BACKGROUND LAYERS -->
  <div id="deep-grid"></div>

  <div id="data-rings">
    <div class="ring" style="width:300px;height:300px; animation-delay:0s;"></div>
    <div class="ring" style="width:600px;height:600px; animation-delay:1.5s;"></div>
    <div class="ring" style="width:900px;height:900px; animation-delay:3s;"></div>
    <div class="ring" style="width:1200px;height:1200px; animation-delay:4.5s;"></div>
  </div>

  <svg id="hex-mesh" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="hex" width="56" height="48.5" patternUnits="userSpaceOnUse" patternTransform="scale(1.2)">
        <path d="M14 0 L42 0 L56 24.25 L42 48.5 L14 48.5 L0 24.25 Z"
              fill="none" stroke="rgba(200,169,110,0.5)" stroke-width="0.4"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#hex)"/>
  </svg>

  <div id="facets-wrap">
    <svg id="facets" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="goldFacet" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="rgba(200,169,110,0.22)"/>
          <stop offset="100%" stop-color="rgba(200,169,110,0.02)"/>
        </linearGradient>
        <linearGradient id="emerFacet" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="rgba(80,200,120,0.16)"/>
          <stop offset="100%" stop-color="rgba(80,200,120,0.02)"/>
        </linearGradient>
      </defs>
      <polygon points="200,0 400,150 400,0" fill="url(#goldFacet)"/>
      <polygon points="0,0 200,0 400,150 0,200" fill="url(#emerFacet)"/>
      <polygon points="0,200 400,150 400,400 0,500" fill="rgba(200,169,110,0.08)"/>
      <polygon points="200,0 400,150 300,350 100,350 0,150" fill="rgba(255,255,255,0.04)"/>
      <polygon points="100,350 300,350 400,600 0,600" fill="url(#emerFacet)"/>
      <polygon points="0,600 400,600 400,800 200,700 0,800" fill="url(#goldFacet)"/>
      <polygon points="200,700 400,600 400,800" fill="rgba(80,200,120,0.12)"/>
      <polygon points="0,800 200,700 0,600" fill="rgba(200,169,110,0.09)"/>
      <line x1="200" y1="0" x2="0" y2="150" stroke="rgba(200,169,110,0.2)" stroke-width="0.6"/>
      <line x1="200" y1="0" x2="400" y2="150" stroke="rgba(80,200,120,0.16)" stroke-width="0.6"/>
      <line x1="0" y1="150" x2="400" y2="150" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
      <line x1="0" y1="150" x2="200" y2="700" stroke="rgba(200,169,110,0.12)" stroke-width="0.5"/>
      <line x1="400" y1="150" x2="200" y2="700" stroke="rgba(80,200,120,0.12)" stroke-width="0.5"/>
      <line x1="100" y1="350" x2="300" y2="350" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
      <line x1="0" y1="500" x2="400" y2="400" stroke="rgba(200,169,110,0.08)" stroke-width="0.4"/>
      <line x1="200" y1="700" x2="400" y2="600" stroke="rgba(80,200,120,0.1)" stroke-width="0.5"/>
    </svg>
  </div>

  <div id="data-streams"></div>
  <div id="vignette"></div>
  <div id="embers"></div>
  <div id="scanline"></div>
  <div id="grain"></div>
  <div id="smoke"></div>
  <div id="glitch"></div>
  <div id="parchment-glow"></div>

  <div id="brand-mark">SYS::ORACULUS</div>

  <div id="stage">

    <!-- P0 — Project O.D.I.A. boot sigil -->
    <div id="phase-0">
      <div id="boot-prefix">PROJECT</div>
      <div id="boot-odia"></div>
      <div id="boot-tagline">— a civic accountability intelligence platform —</div>
    </div>

    <!-- P1 — ORACULUS / divider / DECIMUS -->
    <div id="phase-1">
      <div id="title-word-1"></div>
      <div class="gap-line"></div>
      <div id="title-divider"></div>
      <div class="gap-line"></div>
      <div id="title-word-2"></div>
    </div>

    <!-- P2 — Equation + Code -->
    <div id="phase-2">
      <div class="eq-row" id="eq-row">
        <span class="us-tok" id="us-left">US</span>
        <span class="plus" id="plus">+</span>
        <span class="us-tok" id="us-right">US</span>
      </div>
      <div id="code-block">
        <div id="code-lines"></div><span id="cursor"></span>
      </div>
    </div>

    <!-- P3 — Declaration script -->
    <div id="phase-3">
      <div id="declaration-frame">

        <div class="rule-wrap" id="rule-top-wrap">
          <div class="rule" id="rule-top"></div>
        </div>

        <div id="declaration-line">
          <span class="dec-word we-cap" id="dec-we">We</span>
          <span class="dec-word" id="dec-the">the</span>
          <span class="dec-word" id="dec-people">People</span>
        </div>

        <div id="inscription-block">
          <div id="inscription-line-1">
            ORACULUS<span class="ins-bullet">●</span>DECIMUS
          </div>
          <div id="inscription-line-2">
            INTELLECT<span class="ins-bullet">●</span>ANALYST
          </div>
        </div>

        <div id="inscription-date">— Polymathic Technology · MMXXVI —</div>

        <div class="rule-wrap" id="rule-bottom-wrap">
          <div class="rule" id="rule-bottom"></div>
        </div>

      </div>

      <div id="brand-tag">audit · accountability · constitution</div>
    </div>

  </div>

  <div id="progress"></div>
  <button id="replay">↻ Replay</button>
</div>

<script>
const W1 = "ORACULUS";
const W2 = "DECIMUS";
const W1_US = [6, 7];
const W2_US = [5, 6];

const ODIA_CHARS = "O.D.I.A.";

const CODE = [
  '> project ............... O.D.I.A.',
  '> input_a ............... "us"',
  '> input_b ............... "us"',
  '> fn: constitutional_union()',
  '> processing .............',
  '> output ................ "we"',
  '> status: ✓  resolved'
];

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const prog = pct => { $('progress').style.width = pct + '%'; };

function spawnEmbers() {
  const wrap = $('embers');
  wrap.innerHTML = '';
  const count = 22;
  for (let i = 0; i < count; i++) {
    const e = document.createElement('div');
    e.className = 'ember';
    e.style.left = (Math.random() * 100) + '%';
    e.style.animationDuration = (12 + Math.random() * 16) + 's';
    e.style.animationDelay = (Math.random() * 12) + 's';
    e.style.setProperty('--drift', ((Math.random() - 0.5) * 80) + 'px');
    e.style.width = e.style.height = (1 + Math.random() * 2.5) + 'px';
    e.style.opacity = (0.4 + Math.random() * 0.4);
    wrap.appendChild(e);
  }
}

function spawnDataStreams() {
  const wrap = $('data-streams');
  wrap.innerHTML = '';
  const chars = '01ABCDEF{}<>/=$•◊';
  const positions = [4, 12, 88, 96];
  positions.forEach((leftPct) => {
    const s = document.createElement('div');
    s.className = 'stream';
    let str = '';
    const len = 30 + Math.floor(Math.random() * 25);
    for (let i = 0; i < len; i++) {
      str += chars[Math.floor(Math.random() * chars.length)] + ' ';
    }
    s.textContent = str;
    s.style.left = leftPct + '%';
    s.style.animationDuration = (18 + Math.random() * 14) + 's';
    s.style.animationDelay = (Math.random() * -10) + 's';
    s.style.opacity = (0.3 + Math.random() * 0.4);
    wrap.appendChild(s);
  });
}

function buildWord(elId, word) {
  const el = $(elId);
  el.innerHTML = '';
  word.split('').forEach((ch, i) => {
    const s = document.createElement('span');
    s.className = 'ltr';
    s.textContent = ch;
    s.id = elId + '_' + i;
    el.appendChild(s);
  });
}

function buildOdia() {
  const el = $('boot-odia');
  el.innerHTML = '';
  ODIA_CHARS.split('').forEach((ch, i) => {
    const s = document.createElement('span');
    s.className = 'odia-char';
    s.textContent = ch;
    s.id = 'odia_' + i;
    el.appendChild(s);
  });
}

function showPhase(n) {
  ['phase-0','phase-1','phase-2','phase-3'].forEach(id => {
    $(id).style.display = 'none';
  });
  $('phase-' + n).style.display = 'flex';
}

async function typeCode() {
  const container = $('code-lines');
  container.innerHTML = '';
  $('code-block').classList.add('visible');
  for (let li = 0; li < CODE.length; li++) {
    const line = CODE[li];
    const lineEl = document.createElement('div');
    if (li === 0) lineEl.classList.add('code-project');
    if (li === 5 || li === 6) lineEl.classList.add('code-output');
    container.appendChild(lineEl);
    for (let ci = 0; ci < line.length; ci++) {
      lineEl.textContent += line[ci];
      // li 0 (project line) typed slightly slower for emphasis; li 4 (processing) suspenseful
      await sleep(li === 4 ? 95 : (li === 0 ? 28 : 18));
    }
    await sleep(li === 4 ? 600 : (li === 5 ? 350 : (li === 0 ? 400 : 90)));
  }
  $('cursor').style.display = 'none';
}

async function run() {
  prog(0);

  // Reset
  $('phase-0').classList.remove('fading-out');
  $('boot-prefix').classList.remove('visible');
  $('boot-odia').classList.remove('visible');
  $('boot-tagline').classList.remove('visible');
  $('smoke').classList.remove('visible');
  $('parchment-glow').classList.remove('visible');
  $('title-divider').classList.remove('open');
  $('title-divider').style.opacity = '1';
  $('eq-row').classList.remove('visible');
  $('eq-row').style.opacity = '';
  $('eq-row').style.transition = '';
  $('eq-row').style.transform = '';
  $('plus').classList.remove('visible');
  $('us-left').classList.remove('lock');
  $('us-right').classList.remove('lock');
  $('code-block').classList.remove('visible');
  $('code-block').style.opacity = '';
  $('code-block').style.transition = '';
  $('rule-top-wrap').classList.remove('open');
  $('rule-bottom-wrap').classList.remove('open');
  $('rule-top').classList.remove('open');
  $('rule-bottom').classList.remove('open');
  $('dec-we').classList.remove('visible');
  $('dec-the').classList.remove('visible');
  $('dec-people').classList.remove('visible');
  $('inscription-line-1').classList.remove('visible');
  $('inscription-line-2').classList.remove('visible');
  $('inscription-date').classList.remove('visible');
  $('brand-tag').classList.remove('visible');
  $('cursor').style.display = 'inline-block';
  $('glitch').classList.remove('flash');

  spawnEmbers();
  spawnDataStreams();
  buildOdia();

  // === PHASE 0 — Project O.D.I.A. boot sigil ===
  showPhase(0);
  await sleep(350);

  // "PROJECT" prefix appears
  $('boot-prefix').classList.add('visible');
  await sleep(550);

  // O.D.I.A. letters cascade in
  $('boot-odia').classList.add('visible');
  for (let i = 0; i < ODIA_CHARS.length; i++) {
    await sleep(110);
    const s = $('odia_' + i);
    if (s) s.classList.add('shown');
  }
  await sleep(450);

  // Tagline
  $('boot-tagline').classList.add('visible');
  prog(8);
  await sleep(2000);  // hold the boot sigil

  // Fade out the boot sigil cleanly
  $('phase-0').classList.add('fading-out');
  await sleep(1000);

  // === PHASE 1 — ORACULUS / DECIMUS ===
  showPhase(1);
  buildWord('title-word-1', W1);
  buildWord('title-word-2', W2);

  await sleep(300);

  for (let i = 0; i < W1.length; i++) {
    await sleep(85);
    const s = $('title-word-1_' + i);
    if (s) s.classList.add('shown');
  }

  await sleep(200);
  $('title-divider').classList.add('open');
  await sleep(420);

  for (let i = 0; i < W2.length; i++) {
    await sleep(85);
    const s = $('title-word-2_' + i);
    if (s) s.classList.add('shown');
  }

  prog(22);
  await sleep(2400);

  // === PHASE 2 — Selective dissolve to US US ===
  const survivors = new Set();
  W1_US.forEach(i => survivors.add('title-word-1_' + i));
  W2_US.forEach(i => survivors.add('title-word-2_' + i));

  survivors.forEach(id => {
    const s = $(id);
    if (s) s.classList.add('gold');
  });

  await sleep(750);

  for (let i = 0; i < W1.length; i++) {
    if (!W1_US.includes(i)) {
      const s = $('title-word-1_' + i);
      if (s) s.classList.add('dissolve');
    }
  }
  for (let i = 0; i < W2.length; i++) {
    if (!W2_US.includes(i)) {
      const s = $('title-word-2_' + i);
      if (s) s.classList.add('dissolve');
    }
  }
  $('title-divider').style.opacity = '0';
  $('smoke').classList.add('visible');

  prog(38);
  await sleep(2400);

  // === PHASE 3 — Equation locks ===
  showPhase(2);
  $('eq-row').classList.add('visible');
  await sleep(750);
  $('us-left').classList.add('lock');
  await sleep(200);
  $('us-right').classList.add('lock');
  await sleep(550);
  $('plus').classList.add('visible');
  prog(54);
  await sleep(950);

  // === PHASE 4 — Code intrusion (now opens with project: O.D.I.A.) ===
  await typeCode();
  prog(72);
  await sleep(900);

  $('glitch').classList.add('flash');

  $('code-block').style.transition = 'opacity 0.9s ease';
  $('code-block').style.opacity = '0';
  $('eq-row').style.transition = 'opacity 0.9s ease, transform 0.9s ease';
  $('eq-row').style.opacity = '0';
  $('eq-row').style.transform = 'scale(0.92)';

  $('parchment-glow').classList.add('visible');
  $('smoke').style.opacity = '0.3';

  await sleep(950);

  // === PHASE 5 — Declaration script ===
  showPhase(3);

  $('rule-top-wrap').classList.add('open');
  $('rule-top').classList.add('open');
  await sleep(600);

  $('dec-we').classList.add('visible');
  prog(82);
  await sleep(900);

  $('dec-the').classList.add('visible');
  await sleep(700);

  $('dec-people').classList.add('visible');
  prog(90);
  await sleep(1200);

  // Stacked inscription — full name only
  $('inscription-line-1').classList.add('visible');
  await sleep(450);
  $('inscription-line-2').classList.add('visible');
  await sleep(700);

  $('inscription-date').classList.add('visible');
  await sleep(600);

  $('rule-bottom-wrap').classList.add('open');
  $('rule-bottom').classList.add('open');
  await sleep(800);

  $('brand-tag').classList.add('visible');
  prog(100);

  // v2.8.1 Fix #4 — Hold the final declaration frame longer (was 1.4s,
  // bumped to 2.4s) so users actually see "We the People" + brand tag
  // before the dashboard fade-in starts. The wordmark and code phases
  // dwell ~3s and ~4s respectively; 1.4s on the final phase felt
  // disproportionately short.
  await sleep(2400);

  // v2.8.1 Fix #3 — reveal the replay pill now that the intro is
  // genuinely complete. Standalone-mode users can replay from here;
  // embedded users will be transitioned out by the parent frame.
  $('seq').classList.add('completed');

  // v2.7.9 B3 — embedded mode handshake.
  if (window.parent && window.parent !== window) {
    window.parent.postMessage('intro:complete', '*');
  }
}

// v2.8.1 Fix #4 — minimum-duration guard. Track the moment the intro
// started. Any click-to-dismiss before the guard expires is absorbed
// (returns immediately). After 4 seconds, clicks behave as before
// (postMessage in embedded mode, run() in standalone mode). The parent
// IntroFrame's Skip button (upper-right corner overlay) is unaffected
// — it has its own 3-second appearance delay and clicking it still
// dismisses immediately. This guard only protects against accidental
// in-iframe clicks during the early phases.
const __INTRO_START = Date.now();
const __DISMISS_GUARD_MS = 4000;

$('replay').addEventListener('click', e => { e.stopPropagation(); run(); });

// v2.7.9 B3 — click-to-dismiss when embedded; click-to-replay when
// standalone. A user who taps anywhere mid-sequence inside the desktop
// app drops straight to the dashboard; the same click in a plain
// browser tab restarts the animation (existing behaviour).
$('seq').addEventListener('click', e => {
  if (e.target.id === 'replay') return;
  // v2.8.1 Fix #4 — absorb clicks during the guard window.
  if (Date.now() - __INTRO_START < __DISMISS_GUARD_MS) return;
  if (window.parent && window.parent !== window) {
    window.parent.postMessage('intro:complete', '*');
  } else {
    run();
  }
});
run();
</script>
</body>
</html>
