name: Build and Release Desktop Apps

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v2.1.0
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write  # Required to create GitHub Releases

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            build_cmd: npm run build:linux
            artifact: ODIA-*.AppImage
          - os: windows-latest
            platform: windows
            build_cmd: npm run build:win
            artifact: ODIA-Setup-*.exe
          - os: macos-latest
            platform: mac-x64
            build_cmd: npm run build:mac -- --x64
            artifact: ODIA-*-x64.dmg
          - os: macos-latest
            platform: mac-arm64
            build_cmd: npm run build:mac -- --arm64
            artifact: ODIA-*-arm64.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rpm libfuse2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Verify package-lock.json exists
        working-directory: desktop
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Error: desktop/package-lock.json not found" >&2
            exit 1
          fi
          echo "package-lock.json found"

      - name: Build Python backend
        working-directory: desktop
        run: |
          npm ci
          npm run build:backend

      - name: Setup Node.js (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend for Electron
        working-directory: frontend
        shell: bash
        env:
          ELECTRON_BUILD: '1'
          # Belt-and-braces with the runtime resolver in lib/api/client.ts.
          # Even if window.odiaDesktop is not yet injected when the first
          # render fires, this bakes the correct base URL into the bundle.
          # Must match BACKEND_HOST:BACKEND_PORT in desktop/src/backend.js.
          NEXT_PUBLIC_API_URL: 'http://127.0.0.1:18741'
        run: |
          npm ci
          npx next build

      - name: Fix _next/ asset paths for Electron subpages
        working-directory: frontend
        shell: bash
        run: python3 ../scripts/fix_electron_paths.py

      - name: Copy frontend to desktop build
        shell: bash
        run: |
          mkdir -p desktop/build/frontend
          if [ -d "frontend/out" ]; then
            cp -r frontend/out/. desktop/build/frontend/
          else
            echo "Error: frontend/out not found. Ensure ELECTRON_BUILD=1 was set." >&2
            exit 1
          fi

      - name: Generate app icon (purple octopus DJ)
        shell: bash
        run: |
          pip install pillow --quiet
          python3 scripts/generate_icon.py

      - name: Build Electron installer
        working-directory: desktop
        run: ${{ matrix.build_cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: odia-desktop-${{ matrix.platform }}
          path: desktop/dist/${{ matrix.artifact }}
          retention-days: 7

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/${{ matrix.artifact }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
