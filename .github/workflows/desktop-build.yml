name: Desktop Build

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "src/**"
      - "frontend/**"
  pull_request:
    branches: [master]
    paths:
      - "desktop/**"
      - "src/**"
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-desktop:
    name: Test Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Verify package-lock.json exists
        working-directory: desktop
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Error: desktop/package-lock.json not found" >&2
            exit 1
          fi
          echo "package-lock.json found"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run desktop tests
        working-directory: desktop
        run: npm test

  build-desktop:
    name: Build (${{ matrix.platform }})
    needs: test-desktop
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            build_cmd: npm run build:linux
          - os: windows-latest
            platform: windows
            build_cmd: npm run build:win
          - os: macos-latest
            platform: mac-x64
            build_cmd: npm run build:mac -- --x64
          - os: macos-latest
            platform: mac-arm64
            build_cmd: npm run build:mac -- --arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build backend
        working-directory: desktop
        run: |
          npm ci
          npm run build:backend

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend (static export for Electron)
        working-directory: frontend
        shell: bash
        env:
          ELECTRON_BUILD: "1"
          # Must match BACKEND_HOST:BACKEND_PORT in desktop/src/backend.js.
          NEXT_PUBLIC_API_URL: "http://127.0.0.1:18741"
        run: npx next build

      - name: Fix _next/ asset paths for Electron subpages
        working-directory: frontend
        shell: bash
        run: |
          python3 - << 'PYEOF'
          import os
          out_dir = 'out'
          count = 0
          for dirpath, _, filenames in os.walk(out_dir):
              for fname in filenames:
                  if not fname.endswith('.html'):
                      continue
                  rel = os.path.relpath(out_dir, dirpath).replace('\\', '/')
                  if rel == '.':
                      continue  # root index.html: assetPrefix already correct
                  fpath = os.path.join(dirpath, fname)
                  with open(fpath, encoding='utf-8') as f:
                      text = f.read()
                  fixed = text.replace('./_next/', rel + '/_next/')
                  if fixed != text:
                      with open(fpath, 'w', encoding='utf-8') as f:
                          f.write(fixed)
                      count += 1
                      print(f'  Patched: {fpath}')
          print(f'Fixed {count} subpage HTML file(s)')
          PYEOF

      - name: Copy frontend output
        shell: bash
        run: |
          mkdir -p desktop/build/frontend
          if [ -d "frontend/out" ]; then
            cp -r frontend/out/. desktop/build/frontend/
          else
            echo "Error: frontend/out not found. Ensure ELECTRON_BUILD=1 was set." >&2
            exit 1
          fi

      - name: Verify package-lock.json exists
        working-directory: desktop
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Error: desktop/package-lock.json not found" >&2
            exit 1
          fi
          echo "package-lock.json found"

      - name: Generate app icon (purple octopus DJ)
        shell: bash
        run: |
          pip install pillow --quiet
          python3 scripts/generate_icon.py

      - name: Build installer
        working-directory: desktop
        run: ${{ matrix.build_cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: odia-desktop-${{ matrix.platform }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          retention-days: 30
