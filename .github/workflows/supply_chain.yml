name: A.R.C.A.D.E. Layer 2 -- Supply Chain Security

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  # ── Secret scanning (gitleaks) ──────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Dependency vulnerability scan (osv-scanner) ─────────────────────────────
  osv-scan:
    name: Dependency Vulnerabilities (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action@v1
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./

  # ── SBOM generation (Syft) ──────────────────────────────────────────────────
  sbom:
    name: Generate SBOM (Syft)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: odia-sbom.spdx.json
          artifact-name: odia-sbom.spdx.json

  # ── Release signing (cosign) ────────────────────────────────────────────────
  # Runs only on tagged releases. Signs the wheel artifact.
  sign-release:
    name: Sign Release (cosign)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - name: Build wheel
        run: pip install build && python -m build --wheel
      - name: Sign wheel
        run: |
          WHEEL=$(ls dist/*.whl)
          cosign sign-blob --yes "$WHEEL" --bundle "${WHEEL}.bundle"
      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-wheel
          path: |
            dist/*.whl
            dist/*.whl.bundle
