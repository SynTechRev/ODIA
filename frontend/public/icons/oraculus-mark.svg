<?xml version="1.0" encoding="UTF-8"?>
<!--
  Oraculus Mark v2 — application icon source SVG
  ===============================================

  Rebuilt at v2.8.0 with colors sampled directly from
  reference_5_gold-swirl-icon-source.png. Every gradient stop is a real
  measured pixel from that painting, not a designer's interpretation.

  Color anchor table (measured):
    catch_light  #eae1cf  L*=0.865   gold-tinted highlight (paint surface lit)
    soft_high    #ded2be  L*=0.808   raised brushstroke face
    catch_warm   #cdc1b0  L*=0.753   warm catch-light on stroke side
    mid_light    #b89664  L*=0.557   mid-stroke value
    primary      #997545  L*=0.435   PRIMARY brand gold (anchor color)
    mid_dark     #8e704b  L*=0.425   mid-stroke shadow
    deep         #4e4033  L*=0.253   inset shadow
    void         #221f1f  L*=0.127   stroke base
    paper        #cdcdc7  L*=0.792   white paint counterpoint
    ink          #090706  L*=0.027   deepest void
    smoke_900    #080c08  body bg

  Rasterise to PNG at:
    192x192 → frontend/public/icons/icon-192.png      (PWA standard)
    512x512 → frontend/public/icons/icon-512.png      (PWA HD + Android)
    512x512 → frontend/public/icons/icon-maskable-512.png
    1024x1024 → desktop/resources/icon.png
    Multi-size .ico → desktop/resources/icon.ico
    Multi-size .icns → desktop/resources/icon.icns

  Recommended rasteriser: librsvg (rsvg-convert) for gradient fidelity.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512" height="512">

  <defs>

    <!-- Background — smoke-950 with a soft centre lift to smoke-900 -->
    <radialGradient id="bgGrad" cx="50%" cy="44%" r="65%">
      <stop offset="0%"   stop-color="#0c0d0e"/>
      <stop offset="60%"  stop-color="#080c08"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>

    <!--
      Primary gold gradient — heavy crescent.
      Rotation 35deg. Warm catch-light at upper-left falling off through
      the measured mid-stroke value to the inset shadow.
      Every stop is a real measured pixel from the painting.
    -->
    <linearGradient id="goldHeavy" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%"   stop-color="#eae1cf"/>  <!-- catch_light -->
      <stop offset="22%"  stop-color="#ded2be"/>  <!-- soft_high -->
      <stop offset="45%"  stop-color="#cdc1b0"/>  <!-- catch_warm -->
      <stop offset="62%"  stop-color="#b89664"/>  <!-- mid_light -->
      <stop offset="78%"  stop-color="#997545"/>  <!-- PRIMARY -->
      <stop offset="100%" stop-color="#4e4033"/>  <!-- deep shadow -->
    </linearGradient>

    <!-- Mid wisp gradient — anchored at PRIMARY, fading to deep -->
    <linearGradient id="goldMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#b89664" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#685339" stop-opacity="0.4"/>
    </linearGradient>

    <!-- White paint counterpoint — measured from painting (not pure white) -->
    <linearGradient id="whiteWisp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cdcdc7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b7afa3" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Soft blur for the outermost wisp halo -->
    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <!-- Inner glow on the heavy crescent edge -->
    <filter id="goldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Layer 1 — opaque dark-stone background -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!--
    Faint hex-mesh underlay — calls back to the intro animation's
    hexagonal grid. Gold-700 (#685339) hairline.
  -->
  <g opacity="0.05">
    <defs>
      <pattern id="hexUnderlay" x="0" y="0" width="56" height="48.5"
               patternUnits="userSpaceOnUse">
        <path d="M14 0 L42 0 L56 24.25 L42 48.5 L14 48.5 L0 24.25 Z"
              fill="none" stroke="#685339" stroke-width="0.6"/>
      </pattern>
    </defs>
    <rect x="48" y="48" width="416" height="416" fill="url(#hexUnderlay)"/>
  </g>

  <!-- Layer 2 — outer white-paint wisp halo -->
  <g filter="url(#softBlur)" opacity="0.45">
    <path d="M 110 290
             A 200 200 0 0 1 256 80
             A 200 200 0 0 1 410 200"
          stroke="url(#whiteWisp)"
          stroke-width="14"
          stroke-linecap="round"
          fill="none"/>
  </g>

  <!-- Layer 3 — mid wisp -->
  <path d="M 420 200
           A 180 180 0 0 0 200 90"
        stroke="url(#goldMid)"
        stroke-width="6"
        stroke-linecap="round"
        fill="none"/>

  <!-- Layer 4 — primary gold crescent -->
  <path d="M 380 130
           A 175 175 0 1 0 256 432
           A 130 130 0 1 1 256 172
           A 86 86 0 1 0 302 290"
        stroke="url(#goldHeavy)"
        stroke-width="50"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
        filter="url(#goldGlow)"/>

  <!-- Layer 5 — gold paint splatter (measured colors) -->
  <g>
    <circle cx="430" cy="320" r="6"  fill="#b89664" opacity="0.85"/>
    <circle cx="80"  cy="200" r="5"  fill="#997545" opacity="0.75"/>
    <circle cx="350" cy="440" r="4"  fill="#cdc1b0" opacity="0.7"/>
    <circle cx="140" cy="80"  r="4"  fill="#b89664" opacity="0.65"/>
    <circle cx="460" cy="440" r="3"  fill="#ded2be" opacity="0.6"/>
    <circle cx="60"  cy="360" r="3"  fill="#b89664" opacity="0.55"/>
    <circle cx="120" cy="440" r="2"  fill="#997545" opacity="0.5"/>
    <circle cx="450" cy="80"  r="2"  fill="#cdc1b0" opacity="0.5"/>
  </g>

  <!-- White paint specks (measured, not pure white) -->
  <g>
    <circle cx="200" cy="450" r="3"  fill="#cdcdc7" opacity="0.4"/>
    <circle cx="395" cy="100" r="2"  fill="#b7afa3" opacity="0.35"/>
    <circle cx="100" cy="280" r="2"  fill="#cdcdc7" opacity="0.3"/>
  </g>

</svg>
