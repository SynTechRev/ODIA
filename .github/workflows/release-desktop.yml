name: Build and Release Desktop Apps

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v2.1.0
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload artifacts to (e.g. v3.9.0)'
        required: false
        default: ''

permissions:
  contents: write  # Required to create GitHub Releases

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            build_cmd: npm run build:linux
            artifact: ODIA-*.AppImage
          - os: windows-latest
            platform: windows
            build_cmd: npm run build:win
            artifact: ODIA-Setup-*.exe
          - os: macos-latest
            platform: mac-x64
            build_cmd: npm run build:mac -- --x64
            artifact: ODIA-*-x64.dmg
          - os: macos-latest
            platform: mac-arm64
            build_cmd: npm run build:mac -- --arm64
            artifact: ODIA-*-arm64.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rpm libfuse2

      - name: Install OCR tooling (Linux)
        # bundled_binaries.py runtime shim uses shutil.which on POSIX, so
        # installing tesseract-ocr + poppler-utils here means any smoke
        # tests run on the CI host get real OCR. End users of the AppImage
        # still need these installed on their own machine (documented in
        # README / QUICKSTART).
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install OCR tooling (macOS)
        # Runtime shim falls back to PATH discovery via shutil.which on
        # macOS too. Brew installs tesseract into /opt/homebrew/bin
        # (arm64) or /usr/local/bin (x64); both are on the runner PATH.
        if: matrix.os == 'macos-latest'
        run: |
          brew install tesseract poppler

      - name: Install OCR tooling (Windows)
        # PyInstaller spec (desktop/odia-backend.spec) looks for Tesseract at
        # C:\Program Files\Tesseract-OCR and Poppler at
        # C:\Program Files\poppler\Library\bin. Install both here so the
        # bundled odia-backend.exe can OCR scanned PDFs out of the box.
        #
        # Tesseract: try chocolatey with exponential backoff (v2.5.1/v2.6.0
        # repeatedly hit community.chocolatey.org HTTP 504 Gateway Timeout on
        # the /api/v2/Packages() endpoint). If chocolatey can't deliver
        # within 3 attempts, fall back to the UB-Mannheim upstream setup
        # installer directly — same binary chocolatey packages internally.
        # Poppler: always direct-download; oschwartz10612's GitHub release
        # has been rock-solid.
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          # ------- Tesseract: chocolatey with retry, fallback to upstream .exe
          $tessPath = "C:\Program Files\Tesseract-OCR\tesseract.exe"
          $chocoOk = $false
          for ($attempt = 1; $attempt -le 3 -and -not $chocoOk; $attempt++) {
            Write-Host "chocolatey tesseract install attempt $attempt/3"
            choco install tesseract --no-progress -y --no-color
            if ($LASTEXITCODE -eq 0 -and (Test-Path $tessPath)) {
              $chocoOk = $true
              Write-Host "  choco succeeded on attempt $attempt"
            } else {
              Write-Host "  choco failed (exit $LASTEXITCODE); sleeping $($attempt * 20)s"
              if ($attempt -lt 3) { Start-Sleep -Seconds ($attempt * 20) }
            }
          }
          if (-not $chocoOk) {
            Write-Host "chocolatey unavailable; falling back to direct UB-Mannheim installer"
            $tessUrl = "https://digi.bib.uni-mannheim.de/tesseract/tesseract-ocr-w64-setup-5.4.0.20240606.exe"
            $tessExe = "$env:TEMP\tesseract-setup.exe"
            Invoke-WebRequest -Uri $tessUrl -OutFile $tessExe -UseBasicParsing
            # UB-Mannheim ships an NSIS installer; /S runs it silently.
            Start-Process -FilePath $tessExe -ArgumentList "/S" -Wait -NoNewWindow
          }
          if (-not (Test-Path $tessPath)) {
            throw "Tesseract install failed after chocolatey + direct fallback: tesseract.exe not found"
          }

          # ------- Poppler: direct download (stable path, no retry needed)
          $popplerUrl = "https://github.com/oschwartz10612/poppler-windows/releases/download/v24.08.0-0/Release-24.08.0-0.zip"
          $popplerZip = "$env:TEMP\poppler.zip"
          Invoke-WebRequest -Uri $popplerUrl -OutFile $popplerZip -UseBasicParsing
          Expand-Archive -Path $popplerZip -DestinationPath "$env:TEMP\poppler_extract" -Force
          $inner = Get-ChildItem -Path "$env:TEMP\poppler_extract" -Directory | Select-Object -First 1
          if ($null -eq $inner) { throw "Poppler archive had unexpected layout" }
          New-Item -ItemType Directory -Path "C:\Program Files\poppler" -Force | Out-Null
          Copy-Item -Path "$($inner.FullName)\*" -Destination "C:\Program Files\poppler\" -Recurse -Force
          if (-not (Test-Path "C:\Program Files\poppler\Library\bin\pdftoppm.exe")) {
            throw "Poppler install failed: pdftoppm.exe not found"
          }

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build Python backend
        working-directory: desktop
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build:backend

      - name: Setup Node.js (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Build frontend for Electron
        working-directory: frontend
        shell: bash
        env:
          ELECTRON_BUILD: '1'
          # Belt-and-braces with the runtime resolver in lib/api/client.ts.
          # Even if window.odiaDesktop is not yet injected when the first
          # render fires, this bakes the correct base URL into the bundle.
          # Must match BACKEND_HOST:BACKEND_PORT in desktop/src/backend.js.
          NEXT_PUBLIC_API_URL: 'http://127.0.0.1:18741'
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx next build

      - name: Fix _next/ asset paths for Electron subpages
        working-directory: frontend
        shell: bash
        run: python3 ../scripts/fix_electron_paths.py

      - name: Copy frontend to desktop build
        shell: bash
        run: |
          mkdir -p desktop/build/frontend
          if [ -d "frontend/out" ]; then
            cp -r frontend/out/. desktop/build/frontend/
          else
            echo "Error: frontend/out not found. Ensure ELECTRON_BUILD=1 was set." >&2
            exit 1
          fi

      - name: Generate app icon (purple octopus DJ)
        shell: bash
        run: |
          pip install pillow --quiet
          python3 scripts/generate_icon.py

      - name: Build Electron installer
        working-directory: desktop
        run: ${{ matrix.build_cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: odia-desktop-${{ matrix.platform }}
          path: desktop/dist/${{ matrix.artifact }}
          retention-days: 7

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release upload "$TAG" desktop/dist/${{ matrix.artifact }} --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
