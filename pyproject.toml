[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odia"
version = "3.7.0"
description = "O.D.I.A. — Oraculus Decimus Intellect Analyst: civic accountability intelligence platform for forensic analysis of legal and government documents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pypdf>=4.0.0",
    "jsonschema>=4.20.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
    "httpx>=0.25.0",
    "sqlalchemy>=2.0",
    "jinja2>=3.0.0",
    "markdown>=3.5.0",
    "requests>=2.28.0",
    # v3.1.0 — fingerprint-resistant HTTP for the async scraper. Wraps
    # libcurl-impersonate to ship Chrome's exact TLS+HTTP2 fingerprint,
    # defeating Akamai/Cloudflare bot detectors that block Python urllib
    # at the handshake layer. Loaded lazily inside _fetch_url so it does
    # not influence import time for non-scraping code paths.
    "curl-cffi>=0.7.0",
    "beautifulsoup4>=4.12.0",
    "python-dateutil>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "python-docx>=1.1.0",
    # v3.3.0 — pyyaml is required for the legal_corpora.yml registry
    # consumed by LegalResolver at boot. Without this, /api/v1/legal/status
    # 503s with "No module named 'yaml'" and statute embedding is dead.
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]
authors = [
    {name = "Synthetic Technology Revolution", email = "syntechrev@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Text Processing :: Filters",
]

[project.urls]
Homepage = "https://github.com/SynTechRev/ODIA"
Repository = "https://github.com/SynTechRev/ODIA"
Documentation = "https://github.com/SynTechRev/ODIA/blob/master/docs/"
Issues = "https://github.com/SynTechRev/ODIA/issues"

[project.scripts]
odia = "oraculus_di_auditor.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "black==24.10.0",
    "ruff==0.8.4",
    "pre-commit==3.8.0",
    "isort==5.13.2",
    "build>=1.0.0",
    "twine>=5.0.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]
legal = [
    "networkx>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"oraculus_di_auditor" = ["py.typed"]
"*" = ["*.json", "*.yaml", "*.yml", "*.md", "*.j2", "*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py311"
fix = true
exclude = [".git", "build", "dist", "**/__pycache__", "_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "C90", "B"]

[tool.ruff.lint.per-file-ignores]
