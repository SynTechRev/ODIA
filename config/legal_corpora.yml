# Registry of installed legal corpora. The legal_resolver reads this
# at boot and instantiates one loader per entry. Corpora not yet
# installed have enabled: false; loaders skip them.

schema_version: "1.0"

corpora:
  - id: us-code
    name: "United States Code"
    enabled: true
    loader: oraculus_di_auditor.legal.us_code_loader.USCodeLoader
    submodule_path: data/legal_corpora/us-code
    source_url: https://github.com/nickvido/us-code
    citation_patterns:
      - "U.S.C."
      - "U.S.C"
      - "USC"
    notes: |
      Federal statutory law. Data starts 2013 (OLRC release points
      as git commits). Pre-2013 history not in repo; resolve_citation
      with as_of < 2013-01-01 returns text at the earliest available
      commit with a note.

  - id: cal_codes
    name: "California Codes"
    enabled: true
    loader: odia_legal.corpus.california_loader.CaliforniaCodeLoader
    submodule_path: data/legal_corpora/cal_codes
    source_url: https://leginfo.legislature.ca.gov
    citation_patterns:
      - "Gov. Code"
      - "Government Code"
      - "Pen. Code"
      - "Penal Code"
      - "Civ. Code"
      - "Civil Code"
      - "Veh. Code"
      - "Welf. & Inst. Code"
      - "Cal. Gov. Code"
    notes: |
      California statute corpus, fetched from leginfo.legislature.ca.gov by
      scripts/ingest_cal_codes.py. Covers CPRA (§§ 7920–7931), AB 481 (§§ 36000–36010),
      Pen. Code § 832.7 (officer records), Civ. Code § 1798.90.51–55 (ALPR),
      Veh. Code § 2413, Welf. & Inst. Code § 827. Re-run ingest script to refresh.

  - id: cpra
    name: "California Privacy Rights Act / CCPA Corpus"
    enabled: true
    loader: oraculus_di_auditor.legal.cpra_corpus.CPRACorpusLoader
    submodule_path: null
    source_url: https://leginfo.legislature.ca.gov
    citation_patterns:
      - "Cal. Civ. Code"
      - "Civil Code"
      - "§ 1798."
      - "CCPA"
      - "CPRA"
      - "CCP §"
      - "Lab. Code §"
    notes: |
      Embedded CPRA/CCPA corpus — no submodule required. Covers 13 provisions:
      Cal. Civ. Code §§ 1798.100, .110, .115, .120, .121, .125, .135, .150;
      CCP §§ 1281.97, 1281.98, 1670.5; Lab. Code § 2699 (PAGA); Gov. Code § 12953 (AB 51).
      Also resolves CONTRA doctrinal_anchor IDs (CCPA_121, CCP_1281_97, etc.) directly.
      Effective date: 2023-01-01 (CPRA operative). Updated in source — no re-ingest needed.

  - id: cfr
    name: "Code of Federal Regulations"
    enabled: true
    loader: odia_legal.corpus.cfr_loader.CFRLoader
    submodule_path: data/legal_corpora/cfr
    source_url: https://www.ecfr.gov
    citation_patterns:
      - "C.F.R."
      - "CFR"
    notes: |
      CFR sections fetched from eCFR renderer API (ecfr.gov). Covers:
        2 CFR Part 200 — Uniform Guidance for federal grants (20 sections)
        28 CFR Part 23 — Criminal intelligence systems operating policies (4 sections)
      Re-run scripts/ingest_cfr.py to refresh.
