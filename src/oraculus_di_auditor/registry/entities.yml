# O.D.I.A. — Cross-Entity Registry
#
# This file is the canonical source of truth for the Sunshine Dragnet
# Entity Registry as defined in the Cross-Entity Analysis Protocol V1.0
# (May 2026). Every document entering the O.D.I.A. pipeline is
# classified against this registry at ingestion time.
#
# Schema
# ------
# tiers:
#   - tier_id: 1 | 2 | 3 | 4
#     label: short human description
#     entities:
#       - id: E-NNN | V-NNN | X-NNN  (Tier 1/2 → E, Tier 3 → V, Tier 4 → X)
#         name: canonical entity name
#         abbreviation: short form for filename / log prefixing
#         aliases: list of alternate strings to scan in document text
#         mas_status: human-readable state (V8.0, INITIATED, NOT_OPENED, NULL)
#         alert_prefix: format string for emitted alert IDs (e.g., "VPD-{n:03d}")
#         next_alert: integer — the next alert number to issue
#         relevance: short description of why this entity matters (for Tier 2-4)
#         presence: list of Tier 1 entity IDs where this vendor/source is confirmed
#         sub_detectors: list of detector module names that activate when this entity is primary
#         notes: free text for analyst context
#
# This file ships with /src/oraculus_di_auditor/registry/entities.yml. The
# registry loader (registry/loader.py) provides typed access; runtime
# updates from the Personnel Register are handled by registry/personnel.py.
#
# IMPORTANT: every change to this file must be committed alongside a test
# update in tests/registry/test_entities.py confirming the integrity of
# the affected tier. Personnel and vendor aliases are case-insensitive at
# scan time; regex anchoring is handled in the detector module.

