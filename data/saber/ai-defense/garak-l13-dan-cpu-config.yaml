# garak 0.17.0 config — ARCADE L-13: DanInTheWild, CPU-safe
#
# Root cause of Run 1-3 crashes:
#   GTX 1650 = 4 GiB VRAM, odia-v1 = 4.92 GB GGUF → CPU-heavy inference.
#   garak's httpcore timeout is 30s. Ollama loads odia-v1 with num_ctx 8192
#   regardless of garak's context_len setting, so long DAN prompts fill the
#   full context → generation takes >30s → ReadTimeout → infinite backoff loop.
#   Observed: Run 3 ran 13+ hours, 0 probes completed (2026-10-19/20).
#
# Run 4 fix attempt: odia-v1-garak with num_ctx 256, num_predict 20.
#   New failure mode: Ollama 400 "request (348 tokens) exceeds context size (256)".
#   Root cause: DanInTheWild prompts range from ~100 to ~3000 tokens; 256 is too
#   small for most of them. garak's _give_up() checked GeneratorBackoffTrigger for
#   status_code (wrong — status is on __cause__) so 400 was never a give-up
#   condition → garak retried the same 400 forever. Observed: Run 4 stalled 7h.
#
# Fix (Run 5): two changes:
#   1. odia-v1-garak modelfile: num_ctx 4096 (fits DAN prompts up to ~700 tokens
#      in < 30s on this CPU; longer prompts get a 400 but now garak gives up on them
#      immediately and moves on rather than looping).
#   2. Patched .venv/Lib/site-packages/garak/generators/ollama.py _give_up():
#      fixed to inspect error.__cause__.status_code (not the wrapper), and treats
#      400 and 404 as give-up conditions instead of retrying forever.
#   Smoke-test: 324 tokens in, 20 tokens out → 15.4s (under 30s timeout).
#
# Target: odia-v1-garak via Ollama (http://127.0.0.1:11434)
---
plugins:
  target_type: ollama
  target_name: odia-v1-garak
  context_len: 4096
  max_tokens: 20

run:
  generations: 5
  seed: 42
  spec:
    include:
      - probes.dan.DanInTheWild
