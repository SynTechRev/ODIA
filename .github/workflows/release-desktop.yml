name: Build and Release Desktop Apps

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v2.1.0
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write  # Required to create GitHub Releases

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: ODIA-*.AppImage
          - os: windows-latest
            platform: windows
            artifact: ODIA-Setup-*.exe
          - os: macos-latest
            platform: mac
            artifact: ODIA-*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rpm libfuse2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build Python backend
        working-directory: desktop
        run: |
          npm ci
          npm run build:backend

      - name: Build frontend for Electron
        working-directory: frontend
        shell: bash
        env:
          ELECTRON_BUILD: '1'
        run: |
          npm ci
          npx next build

      - name: Copy frontend to desktop build
        shell: bash
        run: |
          mkdir -p desktop/build/frontend
          if [ -d "frontend/out" ]; then
            cp -r frontend/out/. desktop/build/frontend/
          else
            echo "Error: frontend/out not found. Ensure ELECTRON_BUILD=1 was set." >&2
            exit 1
          fi

      - name: Build Electron installer
        working-directory: desktop
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: odia-desktop-${{ matrix.platform }}
          path: desktop/dist/${{ matrix.artifact }}
          retention-days: 7

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: desktop/dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
