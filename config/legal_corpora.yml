# Registry of installed legal corpora. The legal_resolver reads this
# at boot and instantiates one loader per entry. Corpora not yet
# installed have enabled: false; loaders skip them.

schema_version: "1.0"

corpora:
  - id: us-code
    name: "United States Code"
    enabled: true
    loader: oraculus_di_auditor.legal.us_code_loader.USCodeLoader
    submodule_path: data/legal_corpora/us-code
    source_url: https://github.com/nickvido/us-code
    citation_patterns:
      - "U.S.C."
      - "U.S.C"
      - "USC"
    notes: |
      Federal statutory law. Data starts 2013 (OLRC release points
      as git commits). Pre-2013 history not in repo; resolve_citation
      with as_of < 2013-01-01 returns text at the earliest available
      commit with a note.

  - id: cal_codes
    name: "California Codes"
    enabled: true
    loader: odia_legal.corpus.california_loader.CaliforniaCodeLoader
    submodule_path: data/legal_corpora/cal_codes
    source_url: https://leginfo.legislature.ca.gov
    citation_patterns:
      - "Gov. Code"
      - "Government Code"
      - "Pen. Code"
      - "Penal Code"
      - "Civ. Code"
      - "Civil Code"
      - "Veh. Code"
      - "Welf. & Inst. Code"
      - "Cal. Gov. Code"
    notes: |
      California statute corpus, fetched from leginfo.legislature.ca.gov by
      scripts/ingest_cal_codes.py. Covers CPRA (§§ 7920–7931), AB 481 (§§ 36000–36010),
      Pen. Code § 832.7 (officer records), Civ. Code § 1798.90.51–55 (ALPR),
      Veh. Code § 2413, Welf. & Inst. Code § 827. Re-run ingest script to refresh.

  # Phase 3+: CFR, federal register
