name: Desktop Build

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "src/**"
      - "frontend/**"
  pull_request:
    branches: [master]
    paths:
      - "desktop/**"
      - "src/**"
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-desktop:
    name: Test Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Verify package-lock.json exists
        working-directory: desktop
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Error: desktop/package-lock.json not found" >&2
            exit 1
          fi
          echo "package-lock.json found"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run desktop tests
        working-directory: desktop
        run: npm test

  build-desktop:
    name: Build (${{ matrix.os }})
    needs: test-desktop
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_cmd: npm run build:linux
          - os: windows-latest
            build_cmd: npm run build:win
          - os: macos-latest
            build_cmd: npm run build:mac

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build backend
        working-directory: desktop
        run: npm run build:backend

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (static export for Electron)
        working-directory: frontend
        shell: bash
        env:
          ELECTRON_BUILD: "1"
        run: npx next build

      - name: Copy frontend output
        shell: bash
        run: |
          mkdir -p desktop/build/frontend
          if [ -d "frontend/out" ]; then
            cp -r frontend/out/. desktop/build/frontend/
          else
            echo "Error: frontend/out not found. Ensure ELECTRON_BUILD=1 was set." >&2
            exit 1
          fi
      - name: Verify package-lock.json exists
        working-directory: desktop
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Error: desktop/package-lock.json not found" >&2
            exit 1
          fi
          echo "package-lock.json found"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installer
        working-directory: desktop
        run: ${{ matrix.build_cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: odia-desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          retention-days: 30
